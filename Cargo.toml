[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "26.11.3"
edition = "2021"
publish = false

[workspace.dependencies]
rawgraph-core = { path = "crates/rawgraph-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

# Image processing is unusable without optimisation, so dependencies are always
# optimised and our own code gets light optimisation even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# "*" does not cover workspace members. These crates do the pixel work, so they
# are fully optimised in dev builds too (debug info is kept); the app and the
# remaining crates stay at opt-level 1 for fast rebuilds.
[profile.dev.package.rawgraph-core]
opt-level = 3

[profile.dev.package.rawgraph-engine]
opt-level = 3

[profile.dev.package.rawgraph-scopes]
opt-level = 3

[profile.dev.package.rawgraph-io]
opt-level = 3

[profile.dev.package.rawgraph-fx]
opt-level = 3

[profile.release]
lto = "thin"

# Fast-to-rebuild testing build used by `RawGraph Dev.cmd`: release optimisation
# without link-time optimisation and with incremental compilation, so changing
# app code only recompiles the changed crates instead of re-linking everything
# through LTO. Shipped preview builds still use `release`.
[profile.iter]
inherits = "release"
lto = false
incremental = true
codegen-units = 16
