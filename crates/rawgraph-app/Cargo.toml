[package]
name = "rawgraph-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "accesskit", "persistence", "default_fonts", "wayland", "x11"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
rawgraph-batch = { version = "26.11.1", path = "../rawgraph-batch" }
rawgraph-core.workspace = true
rawgraph-engine = { version = "26.11.1", path = "../rawgraph-engine" }
rawgraph-fx = { path = "../rawgraph-fx" }
rawgraph-gpu = { path = "../rawgraph-gpu" }
rawgraph-io = { version = "26.11.1", path = "../rawgraph-io" }
rawgraph-project = { version = "26.11.1", path = "../rawgraph-project" }
rawgraph-rename = { path = "../rawgraph-rename" }
rawgraph-scope-views = { version = "26.11.1", path = "../rawgraph-scope-views" }
rawgraph-scopes = { version = "26.11.1", path = "../rawgraph-scopes" }
arboard = { version = "3", default-features = false }
rayon.workspace = true
rfd = "0.18.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3.27.0"
