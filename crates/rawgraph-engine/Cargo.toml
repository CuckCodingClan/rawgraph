[package]
name = "rawgraph-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rawgraph-core.workspace = true
rawgraph-scopes = { path = "../rawgraph-scopes" }
rawgraph-fx = { path = "../rawgraph-fx" }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Custom harness: the test executable doubles as the fake depth worker (`--fake <mode> ...`).
[[test]]
name = "depth_worker"
harness = false
