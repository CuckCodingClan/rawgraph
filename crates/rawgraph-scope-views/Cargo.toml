[package]
name = "rawgraph-scope-views"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "egui widgets for the RawGraph scopes: histogram, waveform, RGB parade, vectorscope"

[dependencies]
rawgraph-scopes = { path = "../rawgraph-scopes" }
egui = "0.37.0"

[dev-dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
