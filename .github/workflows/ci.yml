name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the macOS job (macOS minutes count ten times on private repositories)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # RAWGRAPH_SAMPLES is deliberately NOT set: there are no photos on CI and the
  # tests that need them skip themselves.

jobs:
  linux:
    name: Linux (clippy + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        # winit (x11 + wayland), xkbcommon, GL/Vulkan loaders for wgpu. rfd 0.18 uses
        # neither GTK nor the xdg portal here (Cargo.lock has no gtk/ashpd), so no GTK.
        # mesa-vulkan-drivers provides the llvmpipe software adapter (lavapipe).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  windows:
    name: Windows (tests)
    # Windows minutes count double on private repositories: not on plain pushes.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  macos:
    name: macOS (build + tests)
    # macOS minutes count ten times on private repositories: manual opt-in only.
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Tests
        run: cargo test --workspace --no-fail-fast
